<div class="modal-overlay" *ngIf="isModalOpen">
  <div class="modal">
    <div class="modal-header">
      <h2>Edit Member</h2>
      <button class="close-btn" (click)="closeModal()">✖</button>
    </div>

    <form [formGroup]="memberForm" (ngSubmit)="onSubmit()">
      <div class="modal-body">
        <!-- Member ID -->
        <div class="form-group">
          <label>Member ID</label>
          <input formControlName="id" readonly class="readonly-field">
        </div>

        <div class="form-group">
          <label>Name <span class="required">*</span></label>
          <input formControlName="name" placeholder="Enter full name">
          <div *ngIf="memberForm.get('name')?.invalid && memberForm.get('name')?.touched" class="error-message">
            <span *ngIf="memberForm.get('name')?.errors?.['required']">Name is required</span>
            <span *ngIf="memberForm.get('name')?.errors?.['minlength']">Name must be at least 2 characters</span>
          </div>
        </div>

        <div class="form-group">
          <label>Contact <span class="required">*</span></label>
          <input type="tel" formControlName="phone" placeholder="+237 12345678">
          <div *ngIf="memberForm.get('phone')?.invalid && memberForm.get('phone')?.touched" class="error-message">
            <span *ngIf="memberForm.get('phone')?.errors?.['required']">Contact is required</span>
            <span *ngIf="memberForm.get('phone')?.errors?.['pattern']">Format: +237 12345678</span>
          </div>
        </div>

        <div class="form-group">
          <label>Member Type <span class="required">*</span></label>
          <select formControlName="type">
            <option value="">Select type</option>
            <option>Farmer</option>
            <option>Cooperative</option>
          </select>
          <div *ngIf="memberForm.get('type')?.invalid && memberForm.get('type')?.touched" class="error-message">
            Member type is required
          </div>
        </div>

        <div class="form-group">
          <label>Location <span class="required">*</span></label>
          <select formControlName="region">
            <option value="">Select region</option>
            <option>North West</option>
            <option>South West</option>
            <option>Littoral</option>
            <option>Centre</option>
            <option>West</option>
            <option>Far North</option>
          </select>
          <div *ngIf="memberForm.get('region')?.invalid && memberForm.get('region')?.touched" class="error-message">
            Location is required
          </div>
        </div>

        <div class="form-group">
          <label>Primary Crop <span class="required">*</span></label>
          <select formControlName="primaryCrop">
            <option value="">Select crop</option>
            <option>Cocoa</option>
            <option>Coffee</option>
            <option>Maize</option>
            <option>Plantains</option>
            <option>Cotton</option>
          </select>
          <div *ngIf="memberForm.get('primaryCrop')?.invalid && memberForm.get('primaryCrop')?.touched" class="error-message">
            Primary crop is required
          </div>
        </div>

        <div class="form-group">
          <label>Status <span class="required">*</span></label>
          <select formControlName="status">
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
            <option value="Pending">Pending</option>
          </select>
          <div *ngIf="memberForm.get('status')?.invalid && memberForm.get('status')?.touched" class="error-message">
            Status is required
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Farm Location</label>
        <input formControlName="farmLocation" placeholder="e.g.,Mankon Town, GPS coordinates">
        <small class="field-description">Specific location of the farm (village, town, or GPS)</small>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn-cancel" (click)="closeModal()">Cancel</button>
        <button type="submit" class="btn-submit" [disabled]="isSubmitting || !memberForm.valid">
          {{ isSubmitting ? 'Updating...' : 'Update Member' }}
        </button>
      </div>
    </form>
  </div>
</div>
