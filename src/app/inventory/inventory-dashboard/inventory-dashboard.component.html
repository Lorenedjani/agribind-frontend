<div class="dashboard-cards">
  <div class="card">
    <div class="card-title">Total Inventory Value</div>
    <div class="card-value">{{ totalValue }}</div>
    <div class="card-sub">+5.7% vs last month</div>
  </div>
  <div class="card">
    <div class="card-title">Farmer Products Stock</div>
    <div class="card-value">{{ farmerProducts }}</div>
    <div class="card-sub">+15.2% cocoa, coffee, etc.</div>
  </div>
  <div class="card">
    <div class="card-title">Input Supplies</div>
    <div class="card-value">{{ inputSupplies }}</div>
    <div class="card-sub">82 active seeds, fertilizers, tools</div>
  </div>
  <div class="card">
    <div class="card-title">Critical Stock Items</div>
    <div class="card-value">{{ criticalItems }}</div>
    <div class="card-sub danger">Need reorder below minimum</div>
  </div>
</div>
