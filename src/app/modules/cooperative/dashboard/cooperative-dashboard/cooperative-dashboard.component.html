<!-- cooperative-dashboard.component.html -->
<div class="dashboard-container">
  <nav class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <i class="fas fa-seedling"></i>
      </div>
      <div class="sidebar-header-text">
        <h3>Agribind</h3>
        <p>Cameroon Cooperative</p>
      </div>
      <button class="close-btn">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="sidebar-nav">
      <a routerLink="/cooperative/dashboard" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><i class="fas fa-home"></i></span>
        <span class="nav-text">Dashboard</span>
      </a>

      <a routerLink="/cooperative/members" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><i class="fas fa-users"></i></span>
        <span class="nav-text">Members</span>
      </a>

      <a routerLink="/cooperative/production" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><i class="fas fa-industry"></i></span>
        <span class="nav-text">Production</span>
      </a>

      <a routerLink="/cooperative/inventory" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><i class="fas fa-box"></i></span>
        <span class="nav-text">Inventory</span>
      </a>

      <a routerLink="/cooperative/credits" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><i class="fas fa-wallet"></i></span>
        <span class="nav-text">Microcredits</span>
      </a>

      <a routerLink="/cooperative/contracts" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><i class="fas fa-file-alt"></i></span>
        <span class="nav-text">Contracts</span>
      </a>

      <a routerLink="/cooperative/transactions" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><i class="fas fa-receipt"></i></span>
        <span class="nav-text">Transactions</span>
      </a>

      <a routerLink="/cooperative/communications" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><i class="fas fa-comment"></i></span>
        <span class="nav-text">Communications</span>
      </a>

      <a routerLink="/cooperative/plant-health" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><i class="fas fa-exclamation-triangle"></i></span>
        <span class="nav-text">Plant Health</span>
      </a>

      <a routerLink="/cooperative/reports" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><i class="fas fa-chart-bar"></i></span>
        <span class="nav-text">Reports</span>
      </a>

      <a routerLink="/cooperative/settings" routerLinkActive="active" class="nav-item">
        <span class="nav-icon"><i class="fas fa-cog"></i></span>
        <span class="nav-text">Settings</span>
      </a>
    </div>
  </nav>

  <div class="main-content-area">
    <!-- Main Header -->
    <header class="main-header">
      <div class="header-left">
        <h2 class="page-title">{{ pageTitle }}</h2>
        <p class="welcome-text">Welcome, Cooperative Admin</p>
      </div>

      <div class="header-right">
        <!-- Language Selector -->
        <div class="language-selector">
          <button class="language-btn" (click)="toggleLanguageDropdown()">
            <span class="current-language">{{ currentLanguage }}</span>
            <span class="dropdown-arrow"><i class="fas fa-chevron-down"></i></span>
          </button>
          <div class="language-dropdown" [class.show]="showLanguageDropdown">
            <button class="language-option" (click)="changeLanguage('FR')">
              <span class="flag">🇫🇷</span>
              Français
            </button>
            <button class="language-option" (click)="changeLanguage('EN')">
              <span class="flag">EN</span>
              English
            </button>
          </div>
        </div>

        <div class="notification-container">
          <button class="notification-btn">
            <span class="notification-icon"><i class="fas fa-bell"></i></span>
            <span class="notification-badge">3</span>
          </button>
        </div>

        <div class="user-profile">
          <button class="profile-btn" (click)="toggleProfileDropdown()">
            <div class="profile-avatar">
              <div class="avatar-fallback">MT</div>
            </div>
            <div class="profile-info">
              <span class="user-name">Merveille Tchuente</span>
              <span class="user-role">Cooperative Admin</span>
            </div>
            <span class="dropdown-arrow"><i class="fas fa-chevron-down"></i></span>
          </button>

          <div class="profile-dropdown" [class.show]="showProfileDropdown">
            <div class="dropdown-header">
              <div class="dropdown-avatar">
                <div class="avatar-fallback">MT</div>
              </div>
              <div class="dropdown-user-info">
                <span class="dropdown-name">Merveille Tchuente</span>
                <span class="dropdown-email">e.Tchuente&#64;agribind.com</span>
                          </div>
            </div>
            <div class="dropdown-menu">
              <a href="#" class="dropdown-item">
                <span class="item-icon"><i class="fas fa-user"></i></span>
                My Profile
              </a>
              <a href="#" class="dropdown-item">
                <span class="item-icon"><i class="fas fa-cog"></i></span>
                Settings
              </a>
              <a href="#" class="dropdown-item">
                <span class="item-icon"><i class="fas fa-lock"></i></span>
                Privacy
              </a>
              <div class="dropdown-divider"></div>
              <a href="#" class="dropdown-item logout">
                <span class="item-icon"><i class="fas fa-sign-out-alt"></i></span>
                Logout
              </a>
            </div>
          </div>
        </div>
      </div>
    </header>
<router-outlet></router-outlet>
  </div>
</div>
