<div class="login-container">
  <div class="background-overlay"></div>
  <div class="glass-card">
    <div class="logo-section">
      <i class="fas fa-leaf"></i>
      <h1>AgriBind Cooperative</h1>
      <p>Welcome back to your agricultural dashboard</p>
    </div>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="input-group">
        <label for="email" class="floating-label">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="glass-input"
          placeholder=" "
        />
        <i class="fas fa-envelope input-icon"></i>
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error">
          Invalid email
        </div>
      </div>
      <div class="input-group">
        <label for="password" class="floating-label">Password</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="glass-input"
          placeholder=" "
        />
        <i class="fas fa-lock input-icon"></i>
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error">
          Password must be at least 6 characters
        </div>
      </div>
      <button type="submit" class="glass-button" [disabled]="isLoading">
        <span *ngIf="!isLoading">Login</span>
        <span *ngIf="isLoading" class="spinner"><i class="fas fa-spinner fa-spin"></i></span>
      </button>
    </form>
    <div class="footer-links">
      <a href="#">Forgot Password?</a>
      <a href="#">Sign Up</a>
    </div>
  </div>
</div>
