server:
  port: 8082

spring:
  application:
    name: auth-service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}  # ✅ Use 'default' profile to disable mock

  datasource:
    url: jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: 237Work1234

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

# ✅ CRITICAL: Service URLs - ADD MISSING NOTIFICATION SERVICE
services:
  user-management: http://localhost:8080
  notification: http://localhost:8083
  communication: http://localhost:8084
  inventory: http://localhost:8085  # ✅ ADD THIS LINE

# ✅ ADD MISSING PASSWORD RESET CONFIGURATION
password-reset:
  token-expiration-minutes: 30  # ✅ ADD THIS LINE - Token expires in 30 minutes

# ✅ Enable Feign logging
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: full

# JWT Configuration
jwt:
  secret: agribind-super-secure-jwt-secret-key-2025-minimum-32-chars
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 2592000000

logging:
  level:
    cm.agribind.auth: DEBUG
    org.springframework.cloud.openfeign: DEBUG
    feign: DEBUG