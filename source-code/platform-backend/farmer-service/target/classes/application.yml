server:
  port: 8082

spring:
  application:
    name: farmer-service
  datasource:
    url: jdbc:mysql://localhost:3306/agribind_farmers
    username: root
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

# Offline sync configuration
offline:
  sync:
    enabled: true
    interval: 300000  # 5 minutes