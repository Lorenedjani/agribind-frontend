---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
  cloud:
    config:
      enabled: false

logging:
  level:
    com.agriplatform.production: DEBUG

