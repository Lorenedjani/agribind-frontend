spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/cooperative_db_prod?useSSL=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: 8081

logging:
  level:
    '[com.agribind.location_service]': INFO
    root: WARN

geocoding:
  service:
    timeout: 10000