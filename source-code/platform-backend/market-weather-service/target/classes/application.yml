server:
  port: ${PORT:8094}

spring:
  application:
    name: market-weather-service
  datasource:
    url: jdbc:mysql://localhost:3307/agribind_market_weather?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  market:
    # Optional: require X-Admin-Key header on POST /api/v1/market/admin/prices (empty = allow in dev)
    admin-key: ${MARKET_ADMIN_KEY:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

market:
  refresh:
    cron: "0 0 6 * * *"
