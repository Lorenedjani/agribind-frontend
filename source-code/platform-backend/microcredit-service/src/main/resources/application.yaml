server:
  port: 8091
  servlet:
    context-path: /microcredit

spring:
  application:
    name: microcredit-service

  # Changed from MongoDB to MySQL
  datasource:
    url: jdbc:mysql://localhost:3306/microcredit_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: your_password_here
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # Added JPA configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  cloud:
    loadbalancer:
      ribbon:
        enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    enabled: true
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: true

# Removed MongoDB connection pooling configuration
# mongodb:
#   connection:
#     pool:
#       max-size: 100
#       min-size: 10
#       max-wait-time: 120000
#       max-connection-life-time: 0

# Removed SSL/TLS configuration for MongoDB Atlas
# ssl:
#   enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      # Changed from mongo to db
      db:
        enabled: true

logging:
  level:
    com.microcredit: DEBUG
    # Changed from MongoDB to JPA/Hibernate
    org.springframework.orm.jpa: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/microcredit-service.log

# Application specific configuration (unchanged)
microcredit:
  loan:
    currency: XAF
    default-repayment-period: 12
    risk:
      low-threshold: 700
      medium-threshold: 500
      max-low-risk-amount: 5000000
      max-medium-risk-amount: 10000000

  notifications:
    enabled: true
    overdue-alert-days: 7
    repayment-reminder-days: 3

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic
  circuitbreaker:
    enabled: true

resilience4j:
  circuitbreaker:
    instances:
      userService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  retry:
    instances:
      userService:
        maxAttempts: 3
        waitDuration: 1s
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.net.ConnectException

# Changed from mongo to db
health:
  db:
    enabled: true