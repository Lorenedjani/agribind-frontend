server:
  port: ${PORT:8091}

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/agribind_microcredit_prod?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jackson:
    default-property-inclusion: non_null

eureka:
  instance:
    hostname: ${HOSTNAME:microcredit-service}
    prefer-ip-address: false

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.microcredit: INFO
    org.springframework: WARN
  file:
    name: /var/log/microcredit-service/application.log
    max-size: 10MB
    max-history: 30