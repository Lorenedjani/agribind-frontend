server:
  port: ${PORT:8091}

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://ismaelulrich121_db_user:${DB_PASSWORD:237-Work-1234}@cluster0.wsQgnas.mongodb.net/microcredit_db_prod?retryWrites=true&w=majority&appName=Cluster0}

