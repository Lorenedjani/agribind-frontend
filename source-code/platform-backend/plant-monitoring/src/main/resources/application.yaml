spring:
  application:
    name: plant-health-monitoring-system
  
  datasource:
    url: jdbc:postgresql://${DB_HOST:db.fhhekkvvtxqwhfockzdx.supabase.co}:${DB_PORT:5432}/${DB_NAME:postgres}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:237_Work_1234}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# File Storage Configuration
file:
  upload:
    dir: ./uploads/plant-photos
    max-size: 10485760 # 10MB
    allowed-extensions: jpg,jpeg,png,gif,bmp
    thumbnail:
      width: 300
      height: 300

# Health Analysis Configuration
plant:
  health:
    thresholds:
      healthy: 80
      moderate: 50
      poor: 20

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Logging configuration
logging:
  level:
    com.plantmonitoring: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  file:
    name: logs/plant-monitoring.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"