spring:
  application:
    name: plant-health-monitoring-system
  
  datasource:
    url: jdbc:postgresql://localhost:5432/plant_monitoring
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# File Storage Configuration
file:
  upload:
    dir: ./uploads/plant-photos
    max-size: 10485760 # 10MB
    allowed-extensions: jpg,jpeg,png,gif,bmp
    thumbnail:
      width: 300
      height: 300

# Health Analysis Configuration
plant:
  health:
    thresholds:
      healthy: 80
      moderate: 50
      poor: 20

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html