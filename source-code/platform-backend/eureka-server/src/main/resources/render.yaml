services:
  - type: web
    name: eureka-server
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: ../
    plan: free
    envVars:
      - key: PORT
        value: "8761"
      - key: EUREKA_CLIENT_REGISTER_WITH_EUREKA
        value: "false"
      - key: EUREKA_CLIENT_FETCH_REGISTRY
        value: "false"
    healthCheckPath: /actuator/health