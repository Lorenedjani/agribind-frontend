services:
  - type: web
    name: eureka-server
    env: java
    buildCommand: ./gradlew build
    startCommand: java -jar build/libs/*.jar
    plan: free
    envVars:
      - key: SERVER_PORT
        value: 8761
      - key: EUREKA_CLIENT_REGISTER_WITH_EUREKA
        value: false
      - key: EUREKA_CLIENT_FETCH_REGISTRY
        value: false
      - key: JAVA_VERSION
         value: 17
    healthCheckPath: /actuator/health