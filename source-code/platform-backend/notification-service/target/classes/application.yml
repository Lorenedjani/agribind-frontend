server:
  port: 8083

spring:
  application:
    name: notification-service
  profiles:
    active: prod

  # Disable Kafka for now
  kafka:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  # RabbitMQ Configuration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # Email Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME:your-email@gmail.com}
    password: ${EMAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Application Configuration - ADD THESE RABBITMQ PROPERTIES
app:
  rabbitmq:
    queue: notification-queue
    exchange: notification-exchange
    routing-key: notification.routing.key

  sms:
    cameroon:
      country-code: "+237"
      enabled: true

# Twilio Configuration
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:test}
  auth-token: ${TWILIO_AUTH_TOKEN:test}
  phone-number: ${TWILIO_PHONE_NUMBER:+15005550006}

# Actuator
management:
  health:
    # Disable all component health checks
    defaults:
      enabled: false
    # Enable only simple checks
    diskspace:
      enabled: true
    ping:
      enabled: true
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info