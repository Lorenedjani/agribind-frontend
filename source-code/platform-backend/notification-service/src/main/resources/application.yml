server:
  port: 8083

spring:
  application:
    name: notification-service
  profiles:
    active: prod

  # Disable Security and related auto-configurations
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

  # Disable Kafka for now
  kafka:
    enabled: false

  # RabbitMQ Configuration
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # Email Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: biancalorene13@gmail.com
    password: ynvybzjmhyquzyss  # SANS ESPACES
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            required: true
            enable: true
          starttls.enable: true
          ssl:
            trust: smtp.gmail.com

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Application Configuration
app:
  rabbitmq:
    queue: notification-queue
    exchange: notification-exchange
    routing-key: notification.routing.key

  sms:
    cameroon:
      country-code: "+237"
      enabled: true

# Twilio Configuration
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:test}
  auth-token: ${TWILIO_AUTH_TOKEN:test}
  phone-number: ${TWILIO_PHONE_NUMBER:+15005550006}

# Actuator - Disable security for actuator endpoints
management:
  health:
    # Disable all component health checks
    defaults:
      enabled: false
    # Enable only simple checks
    diskspace:
      enabled: true
    ping:
      enabled: true
  endpoint:
    health:
      show-details: always
    # Disable security for all actuator endpoints
    enabled-by-default: true
  endpoints:
    web:
      exposure:
        include: health,info
      # Disable security for web endpoints
      base-path: /
  security:
    enabled: false

# Completely disable security
security:
  basic:
    enabled: false
  enabled: false

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  show-actuator: false