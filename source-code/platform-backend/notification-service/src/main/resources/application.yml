server:
  port: 8083

spring:
  application:
    name: notification-service
  profiles:
    active: prod

  kafka:
    enabled: true
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  rabbitmq:
    enabled: true
    host: localhost
    port: 5672
    username: guest
    password: guest

eureka:
  client:
    enabled: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Kafka Topics
app:
  kafka:
    topic: notifications
  rabbitmq:
    exchange: notification-exchange
    queue: notification-queue
    routing-key: notification.routing.key

# SMS Configuration (Twilio)
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:your-account-sid}
  auth-token: ${TWILIO_AUTH_TOKEN:your-auth-token}
  phone-number: ${TWILIO_PHONE_NUMBER:+237000000000}

# Email Configuration
spring.mail:
  host: smtp.gmail.com
  port: 587
  username: ${EMAIL_USERNAME:your-email@gmail.com}
  password: ${EMAIL_PASSWORD:your-app-password}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true

logging:
  level:
    com.agribind.notification_service: INFO
    org.springframework.kafka: INFO
  file:
    name: logs/notification-service.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always