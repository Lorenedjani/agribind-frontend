server:
  port: 8082

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Auth Service
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            #- StripPrefix=1
            - name: RequestLoggingFilter

        # User Management Service
        - id: user-management-service
          uri: lb://user-management-service
          predicates:
            - Path=/api/v1/users/**, /api/v1/farmers/**, /api/v1/cooperatives/**, /api/v1/qrcodes/**, /api/v1/dashboard/**, /api/v1/exports/**
          filters:
            #- StripPrefix=1
            - name: RequestLoggingFilter

        # Notification Service
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            #StripPrefix=0
            - name: RequestLoggingFilter

        # Add this NEW route for Communication Service
        - id: communication-service
          uri: lb://communication  # 'communication' matches the spring.application.name
          predicates:
            - Path=/api/communications/**, /api/messages/**, /api/alerts/**, /api/sms/**, /api/audio/**  # Add your communication endpoints
          filters:
            - name: RequestLoggingFilter

        # Add this NEW route for Inventory Service
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
          filters:
            - name: RequestLoggingFilter

        # Microcredit Service
        - id: microcredit-service
          uri: lb://microcredit-service
          predicates:
            - Path=/api/microcredit/**
          filters:
            - RewritePath=/api/microcredit/(?<segment>.*), /microcredit/api/microcredit/$\{segment}
            - name: RequestLoggingFilter

        # Production Monitoring Service
        - id: production-monitoring-service
          uri: lb://production-monitoring-service
          predicates:
            - Path=/api/v1/production/**
          filters:
            - name: RequestLoggingFilter

        # Plant Monitoring Service
        - id: plant-monitoring-service
          uri: lb://plant-health-monitoring-system
          predicates:
            - Path=/api/v1/plants/**, /api/v1/health/**, /api/v1/disease-reports/**, /api/v1/plant-photos/**
          filters:
            - RewritePath=/api/v1/disease-reports/(?<segment>.*), /api/disease-reports/$\{segment}
            - name: RequestLoggingFilter

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.agribind.api_gateway: DEBUG