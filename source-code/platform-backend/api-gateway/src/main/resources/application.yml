spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-management
          uri: lb://USER-MANAGEMENT-SERVICE
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
          filters:
            - StripPrefix=0
        
        - id: production
          uri: lb://PRODUCTION-SERVICE
          predicates:
            - Path=/api/v1/production/**
          filters:
            - StripPrefix=0
        
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0
        
        - id: inventory
          uri: lb://INVENTORY-SERVICE
          predicates:
            - Path=/api/inventory/**
          filters:
            - StripPrefix=0
        
        - id: communication
          uri: lb://COMMUNICATION-SERVICE
          predicates:
            - Path=/api/communications/**
          filters:
            - StripPrefix=0
        
        - id: notification
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=0
        
        - id: microcredit
          uri: lb://MICROCREDIT-SERVICE
          predicates:
            - Path=/api/microcredit/**
          filters:
            - StripPrefix=0
      
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods: GET,POST,PUT,DELETE,PATCH,OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

server:
  port: 8080