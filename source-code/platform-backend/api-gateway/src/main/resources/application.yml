server:
  port: ${PORT:8081}  # ← Render will set PORT automatically

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      # CORS Configuration (essential for frontend)
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${ALLOWED_ORIGINS:"*"}
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowed-headers:
              - "*"
            allow-credentials: true
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Auth Service
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestLoggingFilter

        # User Management Service
        - id: user-management-service
          uri: lb://user-management-service
          predicates:
            - Path=/api/v1/users/**, /api/v1/farmers/**, /api/v1/cooperatives/**, /api/v1/qrcodes/**, /api/v1/dashboard/**, /api/v1/exports/**
          filters:
            - name: RequestLoggingFilter

        # Notification Service
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - name: RequestLoggingFilter

        # Communication Service
        - id: communication-service
          uri: lb://communication
          predicates:
            - Path=/api/communications/**, /api/messages/**, /api/alerts/**, /api/sms/**, /api/audio/**
          filters:
            - name: RequestLoggingFilter

        # Inventory Service
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
          filters:
            - name: RequestLoggingFilter

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin

# CRITICAL FIX: Updated Eureka URL for Render
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:https://agribind-frontend-795v.onrender.com/eureka/}  # ← Your Eureka URL
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: ${RENDER_SERVICE_NAME:api-gateway}.onrender.com
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true



logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.agribind.api_gateway: INFO
    org.springframework.cloud.netflix.eureka: INFO