server:
  port: ${PORT:8888}

spring:
  application:
    name: config-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:native}  # Use 'native' or 'git' profile

  # Profile: 'native' - Embedded config (for quick start)
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config,file:/config/
    # Enable bootstrap for older Spring Cloud versions (if needed)
    # bootstrap:
    #   enabled: true

---
# Profile: 'git' - Git backend (recommended for production)
spring:
  profiles: git
  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/yourusername/config-repo.git}
          default-label: ${CONFIG_GIT_BRANCH:main}
          search-paths: '{application}'
          clone-on-start: true
          force-pull: true
          timeout: 10

---
# Profile: 'prod' - Production settings with Eureka
spring:
  profiles: prod
  cloud:
    config:
      server:
        bootstrap: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:https://agribind-frontend-795v.onrender.com/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: ${RENDER_SERVICE_NAME:localhost}.onrender.com
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,busrefresh
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    org.springframework.cloud.config: DEBUG
    org.springframework.boot.env: INFO