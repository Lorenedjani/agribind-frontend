server:
  port: ${PORT:8888}

spring:
  application:
    name: config-server
  config:
    # NEW SYNTAX: Use import instead of profiles.active
    import: optional:file:./config/

  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config/,file:./config/,file:/config/
          order: -1

# Default logging
logging:
  level:
    org.springframework.cloud.config: INFO
    org.springframework.boot.env: INFO

---
# Production profile with Eureka
spring:
  config:
    activate:
      on-profile: prod

  cloud:
    config:
      server:
        bootstrap: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:https://agribind-frontend-795v.onrender.com/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: ${RENDER_SERVICE_NAME:localhost}.onrender.com
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,busrefresh
  endpoint:
    health:
      show-details: always

---
# Git backend profile
spring:
  config:
    activate:
      on-profile: git

  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_GIT_URI:https://github.com/yourusername/config-repo.git}
          default-label: ${CONFIG_GIT_BRANCH:Lorene}
          search-paths: '{application}'
          clone-on-start: true
          force-pull: true
          timeout: 10