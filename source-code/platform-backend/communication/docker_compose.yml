# docker-compose.yml
version: '3.8'

services:
  communication-service:
    build: .
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: agribind_communications
      DB_USERNAME: postgres
      DB_PASSWORD: postgres123
      EUREKA_URL: http://localhost:8761/eureka/
    depends_on:
      - postgres-db
    volumes:
      - uploads_volume:/app/uploads

  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: agribind_communications
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  uploads_volume: