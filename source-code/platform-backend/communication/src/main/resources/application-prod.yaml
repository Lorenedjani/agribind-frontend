# application-postgres.yaml
spring:
  application:
    name: communication

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME:wolfdb_fdno}?currentSchema=public&ssl=true&sslmode=require&connectTimeout=30&socketTimeout=30
    username: ${DB_USERNAME:wolfdb_fdno_user}
    password: ${DB_PASSWORD:TfejvXIA0g9Eq10Ju1gKUCP8F9MjbEmH}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate  # Changed from 'update' to 'validate' when using Flyway
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true

  # Flyway Configuration
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
    placeholders:
      defaultSchema: public
    schemas: public

  sql:
    init:
      mode: never  # Disable Spring's SQL init when using Flyway

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${PORT:8084}
  error:
    include-stacktrace: never
    include-message: always
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,flyway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# Flyway specific properties (optional)
flyway:
  url: ${spring.datasource.url}
  user: ${spring.datasource.username}
  password: ${spring.datasource.password}
  connect-retries: 10
  init-sql: SET ROLE 'wolfdb_fdno_user'

# Twilio Configuration
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  phone-number: ${TWILIO_PHONE_NUMBER}

# File Storage
file:
  upload-dir: /tmp/uploads/audio

# Communication Settings
communication:
  sms:
    cost-per-message: 50
  audio:
    max-duration-seconds: 300
    supported-formats: mp3,wav,ogg,m4a,webm
  zones:
    douala:
      - Douala
      - Littoral
    yaounde:
      - Yaounde
      - Centre
    other-regions:
      - Adamaoua
      - East
      - Far-North
      - North
      - North-West
      - South
      - South-West
      - West

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.flywaydb: DEBUG  # Enable Flyway debugging
    org.hibernate: WARN
    com.agribind: DEBUG
  file:
    name: /tmp/logs/application.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"