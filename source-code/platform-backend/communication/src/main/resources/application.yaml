spring:
  application:
    name: communication

  datasource:
    url: jdbc:mysql://root:gOpBKAtqaFyXJtxIwqJXqmDnbIahZgFo@shuttle.proxy.rlwy.net:38695/railway?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:gOpBKAtqaFyXJtxIwqJXqmDnbIahZgFo}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: true

# Twilio Configuration
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:ACaab9ba4a616ebb99d7e27d0244a0bba7}
  auth-token: ${TWILIO_AUTH_TOKEN:d147bf85218474298351409bf12a844c}
  phone-number: ${TWILIO_PHONE_NUMBER:+15736853166}

# File Storage
file:
  upload-dir: ./uploads/audio

# Communication Settings
communication:
  sms:
    cost-per-message: 50 # XAF per SMS
  audio:
    max-duration-seconds: 300
    supported-formats: mp3,wav,ogg,m4a
  zones:
    douala:
      - Douala
      - Littoral
    yaounde:
      - Yaounde
      - Centre
    other-regions:
      - Adamaoua
      - East
      - Far-North
      - North
      - North-West
      - South
      - South-West
      - West

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  show-actuator: false