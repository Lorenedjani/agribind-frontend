spring:
  application:
    name: communication

  datasource:
    url: jdbc:mysql://localhost:3306/agribind_communications
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    hostname: localhost
    prefer-ip-address: true

# Twilio Configuration
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID}
  auth-token: ${TWILIO_AUTH_TOKEN}
  phone-number: ${TWILIO_PHONE_NUMBER}

# File Storage
file:
  upload-dir: ./uploads/audio

# Communication Settings
communication:
  sms:
    cost-per-message: 50 # XAF per SMS
  audio:
    max-duration-seconds: 300
    supported-formats: mp3,wav,ogg,m4a
  zones:
    douala:
      - Douala
      - Littoral
    yaounde:
      - Yaounde
      - Centre
    other-regions:
      - Adamaoua
      - East
      - Far-North
      - North
      - North-West
      - South
      - South-West
      - West